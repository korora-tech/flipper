name: Website

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/website.yaml]
  pull_request:
    paths: [website/**, .github/workflows/website.yaml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build

      # Only main deploys; pull requests stop after the build.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --yes cf@1.0.0-beta.26 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDLFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0aeb879de8e3cdde5fb3d413025222ce
