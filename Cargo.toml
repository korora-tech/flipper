[package]
name = "flipper"
version = "0.1.0"
edition = "2024"
description = "A native GPUI browser and profile picker for Linux"
license = "MIT"
repository = "https://github.com/korora-tech/flipper"

[dependencies]
gpui-kit = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
url = "2"
freedesktop-icons = "0.4"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
